<div id="frame">
  <div>List component</div>
  <div>
    <input type="text" [(ngModel)]="inputText" (keyup.enter)="inputToArray()" placeholder="Enter text" />
    <button (click)="inputToArray()">Dodaj</button>
  </div>
  <ul>
    @for (el of elements; track $index; let i = $index) {
      <li>
        {{ el }}
        <a href="#" (click)="$event.preventDefault(); remove(i)">usuń</a>
      </li>
    }
  </ul>
</div>
