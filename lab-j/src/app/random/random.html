<div id="frame">
  <div>Random component (max = {{ max }})</div>
  <span>{{ myNumber }}</span>
  <button (click)="btnClick()">Losuj</button>
  @if (myNumber !== undefined) {
    <span [class.green]="isSmallerThanHalf()" [class.red]="!isSmallerThanHalf()">
      {{ isSmallerThanHalf() ? 'dolna połowa wartości' : 'górna połowa wartości' }}
    </span>
  }
</div>
